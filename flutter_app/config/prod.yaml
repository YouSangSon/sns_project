# 프로덕션 환경 설정
environment: production

# API Configuration
api:
  base_url: https://api.yoursns.com
  connection_timeout: 30
  receive_timeout: 30
  enable_logging: false

# Database (Supabase)
supabase:
  url: https://your-prod-project.supabase.co
  anon_key: your-prod-supabase-anon-key
  service_role_key: your-prod-supabase-service-role-key

# Feature Flags
features:
  enable_analytics: true
  enable_crash_reporting: true
  enable_debug_menu: false
  enable_mock_data: false

# Pagination
pagination:
  default_page_size: 20
  posts_page_size: 10
  comments_page_size: 20
  messages_page_size: 50

# Storage
storage:
  max_image_size_mb: 10
  allowed_image_types:
    - jpg
    - jpeg
    - png
    - webp

# Cache
cache:
  image_cache_duration_days: 30
  api_cache_duration_minutes: 10

# App Settings
app:
  name: SNS App
  version: 1.0.0
  support_email: support@yoursns.com
