version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sns-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: snsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (Optional - Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sns-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: sns-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Supabase (Local Development)
  # Note: For full Supabase setup, use 'supabase start' CLI
  # This is a simplified version with just the studio

  # Mock API Server (Optional - Node.js/JSON Server)
  mock-api:
    image: node:18-alpine
    container_name: sns-mock-api
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./mock-server:/app
    command: sh -c "npm install -g json-server && json-server --watch db.json --port 8080 --host 0.0.0.0"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: sns-network
