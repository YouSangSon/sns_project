# 스테이징 환경 설정
environment: staging

# API Configuration
api:
  base_url: https://staging-api.yoursns.com
  connection_timeout: 30
  receive_timeout: 30
  enable_logging: true

# Database (Supabase)
supabase:
  url: https://your-staging-project.supabase.co
  anon_key: your-staging-supabase-anon-key
  service_role_key: your-staging-supabase-service-role-key

# Feature Flags
features:
  enable_analytics: true
  enable_crash_reporting: true
  enable_debug_menu: true
  enable_mock_data: false

# Pagination
pagination:
  default_page_size: 20
  posts_page_size: 10
  comments_page_size: 20
  messages_page_size: 50

# Storage
storage:
  max_image_size_mb: 10
  allowed_image_types:
    - jpg
    - jpeg
    - png
    - gif
    - webp

# Cache
cache:
  image_cache_duration_days: 7
  api_cache_duration_minutes: 5

# App Settings
app:
  name: SNS App (Staging)
  version: 1.0.0
  support_email: staging@yoursns.com
