name: sns_app
description: A SNS application built with Flutter using Clean Architecture
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.1.0

  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Supabase
  supabase_flutter: ^2.3.4

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Functional Programming
  dartz: ^0.10.1

  # UI Components
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0

  # Image Picker
  image_picker: ^1.0.7

  # Utilities
  intl: ^0.18.1
  timeago: ^3.6.1
  equatable: ^2.0.5
  uuid: ^4.3.3
  yaml: ^3.1.2

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - config/dev.yaml
    - config/staging.yaml
    - config/prod.yaml
